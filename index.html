<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --sidebar-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
            --accent-blue: #1e56a0;
            --accent-hover: #163f75;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background-color: var(--accent-blue);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .brand-text h2 {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .brand-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item.active a, .nav-item a:hover {
            background-color: #f0f4f8;
            color: var(--accent-blue);
        }

        /* Main Workspace Content Area */
       main {
    flex: 1;
    min-width: 0;
    width: calc(100% - 260px);
    padding: 40px;
    overflow-y: auto;
}

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 32px;
        }

        .header-title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header-title p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-primary {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        /* Analytics / Stat Cards Section */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .card-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .card-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            color: #2e7d32;
            font-weight: 600;
            font-size: 1.5rem;
        }

        /* Management Panel / Form Wrapper */
        .form-section {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: var(--card-shadow);
            max-width: 800px;
        }

        .form-section h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .submit-container {
            display: flex;
            justify-content: flex-end;
        }

        .btn-submit {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }
        /* Hide inactive sections */
[hidden] {
    display: none !important;
}

/* Table formatting */
table {
    width: 100%;
    border-collapse: collapse;
}

table th,
table td {
    padding: 14px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
    font-size: 0.85rem;
}

table th {
    background: #f8fafc;
    color: var(--text-muted);
}

/* Responsive layout */
@media (max-width: 768px) {
    body {
        height: auto;
        min-height: 100vh;
        overflow: auto;
        flex-direction: column;
    }

    aside {
        width: 100%;
        padding: 15px;
    }

    .nav-menu {
        flex-direction: row;
        flex-wrap: wrap;
    }

    main {
        width: 100%;
        padding: 20px;
    }

    .metrics-grid,
    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full-width {
        grid-column: span 1;
    }
}
    </style>
</head>
<body>

    <!-- Left Sidebar Section -->
    <aside>
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">
                <h2>Library</h2>
                <p>Management System</p>
            </div>
        </div>

        <ul class="nav-menu">
    <li class="nav-item active">
        <a href="#" data-view="dashboard">📋 Dashboard</a>
    </li>

    <li class="nav-item">
        <a href="#" data-view="inventory">📖 Book Inventory</a>
    </li>

    <li class="nav-item">
        <a href="#" data-view="add">➕ Add New Book</a>
    </li>

    <li class="nav-item">
        <a href="#" data-view="borrow">🔄 Borrow & Return</a>
    </li>

    <li class="nav-item">
        <a href="#" data-view="history">📜 Transaction History</a>
    </li>
</ul>
    </aside>

    <!-- Main Workspace Area -->
    <main>
        <header>
            <div class="header-title">
                <h1>Dashboard</h1>
                <p>Manage your library collection in one place.</p>
            </div>
            <button class="btn-primary" id="addBookBtn">
    + Add Book
</button>
        </header>

        <!-- Metric Stat Cards Grid -->
        <section class="metrics-grid">
    <div class="card">
        <p class="card-label">Total Book Titles</p>
        <p class="card-value" id="totalBooks">0</p>
    </div>

    <div class="card">
        <p class="card-label">Available Copies</p>
        <p class="card-value" id="searchResults">0</p>
    </div>

    <div class="card">
        <p class="card-label">System Status</p>
        <p class="status-badge">Active</p>
    </div>
</section>

        <!-- Dynamic Content Panel (Add Book Form View) -->
        <section class="form-section" id="addBookPanel">
    <h3>Add a New Book</h3>
    <form id="addBookForm">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label for="title">Book Title</label>
                        <input type="text" id="title" name="title" required placeholder="e.g. Clean Code">
                    </div>
                    
                    <div class="form-group">
                        <label for="author">Author</label>
                        <input type="text" id="author" name="author" required>
                    </div>

                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" required>
                    </div>

                    <div class="form-group">
                        <label for="publicationYear">Publication Year</label>
                        <input type="number" id="publicationYear" name="publicationYear" required>
                    </div>

                    <div class="form-group">
                        <label for="availableCopies">Available Copies</label>
                        <input type="number" id="availableCopies" name="availableCopies" required min="0">
                    </div>
                </div>

                <div class="submit-container">
                    <button type="submit" class="btn-submit">Save Book</button>
                </div>
            </form>
        </section>
    </main>

<script src="script.js"></script>

</body>
</html>
